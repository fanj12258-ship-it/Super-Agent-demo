<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>AgentOS · 场景工作台 Demo</title>
<style>
:root{
  --ink:#2c2c28;--ink2:#5c5b56;--mute:#8c8b85;--faint:#b4b3ad;
  --line:rgba(44,44,40,.08);--line2:rgba(44,44,40,.13);
  --hover:rgba(44,44,40,.045);--active:rgba(44,44,40,.07);
  --paper:#f7f7f4;--sb:#f9fafb;
  --accent:#5a7390;--accent-wash:#eef2f6;--accent-line:#d3dce6;--accent-ink:#3d5873;
  --amber:#b7791f;--amber-bg:#fff6e5;--amber-line:#f3dfb4;
  --green:#2f7d5b;--green-bg:#eaf6f0;--green-line:#c6e5d6;
  --red:#b4443c;--red-bg:#fdeeee;--red-line:#f3cbc8;
  --blue:#3e6a9c;--blue-bg:#eaf1f9;--blue-line:#cddff1;
  --ease:cubic-bezier(.2,.8,.2,1);
  --lw:260px;--rw:560px;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;color:var(--ink);background:#fff;font-size:12px;line-height:1.6;overflow:hidden}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0}
textarea,input,select{font:inherit;color:inherit}
svg{flex:none}
b{font-weight:600}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:rgba(44,44,40,.14);border-radius:9px;border:2.5px solid transparent;background-clip:content-box}
::-webkit-scrollbar-thumb:hover{background:rgba(44,44,40,.28);background-clip:content-box;border:2.5px solid transparent}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes fadein{from{opacity:0}to{opacity:1}}
@keyframes pop{0%{transform:scale(.4);opacity:0}60%{transform:scale(1.18)}100%{transform:scale(1);opacity:1}}
@keyframes shim{to{background-position:-200% 0}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
@keyframes glow{0%,100%{box-shadow:0 0 0 0 rgba(47,47,47,.3)}50%{box-shadow:0 0 0 7px rgba(47,47,47,0)}}
@keyframes ring{0%{box-shadow:0 0 0 0 rgba(90,115,144,.45)}100%{box-shadow:0 0 0 10px rgba(90,115,144,0)}}
@keyframes flash{0%{background:#fff3c4}100%{background:transparent}}
body.fast *,body.fast *::before,body.fast *::after{animation-duration:.001ms!important;animation-delay:0s!important;transition-duration:.001ms!important;transition-delay:0s!important}

/* ===== shell ===== */
#app{display:flex;height:100vh;width:100vw}
.side{flex:none;overflow:hidden;position:relative;transition:width .36s var(--ease)}
#left{width:var(--lw);background:var(--sb);border-right:1px solid var(--line)}
#right{width:var(--rw);background:#fff;border-left:1px solid var(--line)}
.side.collapsed{width:0!important;border-width:0}
.side-in{height:100%;display:flex;flex-direction:column;min-height:0}
#left .side-in{width:var(--lw)}
#right .side-in{width:var(--rw)}
body.resizing{cursor:col-resize;user-select:none}
body.resizing .side{transition:none!important}
.rz{flex:none;width:0;position:relative;z-index:30;cursor:col-resize}
.rz.off{display:none}
.rz::before{content:"";position:absolute;top:0;bottom:0;left:-6px;width:12px}
.rz::after{content:"";position:absolute;top:0;bottom:0;left:-1px;width:2px;background:transparent;transition:background .15s}
.rz:hover::after,body.resizing .rz.act::after{background:rgba(90,115,144,.5)}
#main{flex:1;min-width:0;display:flex;flex-direction:column;position:relative;background:#fff}
#top{height:48px;flex:none;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:0 12px;border-bottom:1px solid var(--line);container-type:inline-size;position:relative;z-index:5;background:#fff}
.top-l{display:flex;align-items:center;gap:8px;min-width:0;flex:1 1 0}
.top-c{flex:none}
.top-r{display:flex;align-items:center;gap:6px;flex:1 1 0;justify-content:flex-end;min-width:0}
.crumb{display:flex;align-items:center;gap:8px;min-width:0;font-size:13px;font-weight:600;letter-spacing:-.01em;white-space:nowrap;overflow:hidden}
.crumb .sep{color:var(--faint);font-weight:400}
#views{flex:1;position:relative;min-height:0}
.view{position:absolute;inset:0;opacity:0;pointer-events:none;transform:translateY(10px);transition:opacity .4s var(--ease),transform .4s var(--ease);overflow:hidden;visibility:hidden}
.view.on{opacity:1;pointer-events:auto;transform:none;visibility:visible}
.ibtn{width:28px;height:28px;border-radius:8px;display:inline-grid;place-items:center;color:#7d7c76;transition:background .15s,color .15s}
.ibtn:hover{background:var(--hover);color:var(--ink)}
.ibtn.on{color:var(--ink);background:var(--active)}
.grow{flex:1}

/* lifecycle */
#life{display:flex;align-items:center;font-size:11px;transition:opacity .4s}
#life.idle .ls{color:var(--faint)}
.ls{display:flex;align-items:center;gap:6px;height:26px;padding:0 9px 0 6px;border-radius:999px;color:var(--faint);transition:background .3s,color .3s;white-space:nowrap;cursor:default}
.ls .d{width:15px;height:15px;border-radius:50%;border:1.5px solid currentColor;display:grid;place-items:center;font-size:8.5px;font-weight:600;transition:all .3s;line-height:1}
.ls.done{color:var(--ink2)}
.ls.done .d{background:var(--green);border-color:var(--green);color:#fff}
.ls.on{background:#f1f3f6;color:var(--ink);font-weight:600}
.ls.on .d{background:var(--accent);border-color:var(--accent);color:#fff;animation:ring 1.8s ease-out infinite}
.lc{width:14px;height:1.5px;background:var(--line2);border-radius:2px;transition:background .4s}
.lc.done{background:var(--green)}
@container (max-width:900px){.ls:not(.on) .lb{display:none}.ls:not(.on){padding:0 4px}}
@container (max-width:760px){.lc{width:6px}.ls:not(.on){padding:0 2px}#crumb .chip.slate{display:none}.top-r .btn:not(.primary){display:none}}
@container (max-width:470px){#life{display:none}}

/* chips */
.chip{display:inline-flex;align-items:center;gap:4px;height:18px;padding:0 7px;border-radius:999px;font-size:10px;font-weight:500;background:#f1f1f3;color:#6a6a66;white-space:nowrap;line-height:1}
.chip.amber{background:var(--amber-bg);color:var(--amber)}
.chip.green{background:var(--green-bg);color:var(--green)}
.chip.blue{background:var(--blue-bg);color:var(--blue)}
.chip.red{background:var(--red-bg);color:var(--red)}
.chip.slate{background:var(--accent-wash);color:var(--accent-ink)}
.chip.ink{background:#2f2f2f;color:#fff}
.chip.line{background:#fff;border:1px solid var(--line2)}
.chip .dot{width:5px;height:5px;border-radius:50%;background:currentColor}
.chip.live .dot{animation:pulse 1.4s infinite}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:28px;padding:0 12px;border-radius:8px;font-size:12px;font-weight:500;border:1px solid var(--line2);background:#fff;color:var(--ink);transition:background .16s,transform .12s,box-shadow .16s,opacity .2s;white-space:nowrap}
.btn:hover{background:#f6f6f7}
.btn:active{transform:scale(.97)}
.btn.primary{background:#2f2f2f;border-color:#2f2f2f;color:#fff}
.btn.primary:hover{background:#1a1a1a}
.btn.accent{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.accent:hover{background:#4b627d}
.btn.green{background:var(--green);border-color:var(--green);color:#fff}
.btn.sm{height:24px;padding:0 9px;font-size:11px;border-radius:7px}
.btn.ghost{border-color:transparent;background:transparent;color:var(--ink2)}
.btn.ghost:hover{background:var(--hover)}
.btn[disabled]{opacity:.42;pointer-events:none}
.btn.glow{animation:glow 2s ease-in-out infinite}
.btnrow{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.kbd{font-family:var(--mono);font-size:10px;padding:1px 5px;border-radius:4px;background:rgba(255,255,255,.18);margin-left:2px}
.btn:not(.primary):not(.accent):not(.green) .kbd{background:#f1f1f3;color:#777}

/* ===== sidebar ===== */
.sb-head{height:48px;flex:none;display:flex;align-items:center;gap:8px;padding:0 10px 0 14px}
.sb-proj{margin:6px 0 10px;border:1px solid var(--line2);border-radius:11px;background:#fff;overflow:hidden}
.sb-proj-btn{width:100%;display:flex;align-items:center;gap:8px;padding:10px 11px;text-align:left;cursor:pointer;transition:background .15s}
.sb-proj-btn:hover{background:var(--hover)}
.sb-proj-btn .meta{flex:1;min-width:0}
.sb-proj-btn b{display:block;font-size:12.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sb-proj-btn small{display:block;margin-top:2px;color:var(--mute);font-size:10.5px}
.sb-proj-btn .cv{color:var(--faint);transition:transform .2s}
.sb-proj.open .sb-proj-btn .cv{transform:rotate(180deg)}
.sb-proj-list{display:none;border-top:1px solid var(--line);padding:4px;max-height:180px;overflow:auto}
.sb-proj.open .sb-proj-list{display:block}
.sb-proj-list .pi{display:flex;align-items:center;gap:8px;padding:7px 8px;border-radius:8px;cursor:pointer;color:var(--ink2);font-size:12px}
.sb-proj-list .pi:hover{background:var(--hover)}
.sb-proj-list .pi.on{background:var(--active);color:var(--ink);font-weight:500}
.sb-proj-list .pi .s{margin-left:auto;font-size:10px;color:var(--faint)}
.chat-proj{flex:none;display:flex;align-items:center;gap:8px;padding:8px 14px;border-bottom:1px solid var(--line);background:#fafafa}
.chat-proj b{font-size:12px;font-weight:600}
.chat-proj .grow{flex:1}
.chat-proj select{height:26px;border:1px solid var(--line2);border-radius:7px;background:#fff;padding:0 8px;font-size:11.5px;color:var(--ink2);max-width:180px}
.brand{display:flex;align-items:center;gap:8px;font-weight:600;font-size:13px;letter-spacing:-.01em}
.brand i{width:20px;height:20px;border-radius:7px;background:linear-gradient(140deg,#2c2c28 10%,#5a7390 100%);display:grid;place-items:center;color:#fff}
.brand small{font-weight:400;color:var(--faint);font-size:10px}
.sb-scroll{flex:1;min-height:0;overflow:auto;padding:2px 8px 16px;animation:fadein .35s}
.sb-new{display:flex;align-items:center;gap:8px;height:32px;margin:4px 0 6px;padding:0 10px;border-radius:9px;background:#fff;border:1px solid var(--line2);font-weight:500;width:100%;transition:all .16s}
.sb-new:hover{border-color:var(--accent-line);background:var(--accent-wash)}
.sb-sec{margin-top:12px}
.sb-sec h6{margin:0 8px 5px;display:flex;justify-content:space-between;align-items:center;font-size:10px;font-weight:500;letter-spacing:.04em;color:var(--faint)}
.sb-item{display:flex;align-items:center;gap:8px;min-height:30px;padding:5px 8px;border-radius:8px;color:var(--ink2);cursor:pointer;transition:background .15s,color .15s;animation:rise .4s var(--ease) both;position:relative}
.sb-item:hover{background:var(--hover)}
.sb-item.on{background:var(--active);color:var(--ink)}
.sb-item .t{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sb-item .s{font-size:10px;color:var(--faint)}
.sb-item.dimmed{opacity:.5}
.sdot{width:7px;height:7px;border-radius:50%;flex:none;background:#a6a59e;transition:background .4s}
.sdot.draft{background:#a6a59e}.sdot.pending{background:#d6921f}.sdot.confirmed{background:#3a8f7a}.sdot.testable{background:#4a78b0}.sdot.ready{background:#2f7d4f}
.sb-foot{flex:none;padding:10px 12px;border-top:1px solid var(--line);display:flex;align-items:center;gap:9px;font-size:11px;color:var(--ink2)}
.avatar{width:24px;height:24px;border-radius:50%;background:linear-gradient(135deg,#c9d6e3,#8ea5bd);color:#fff;display:grid;place-items:center;font-size:10px;font-weight:600}
.proj{margin:4px 0 8px;padding:10px 11px;border-radius:11px;background:#fff;border:1px solid var(--line2);animation:rise .45s var(--ease) both}
.proj-n{display:flex;align-items:center;gap:7px;font-weight:600;font-size:12.5px}
.proj-m{display:flex;flex-wrap:wrap;gap:5px;margin-top:7px}
.proj-src{margin-top:8px;padding-top:8px;border-top:1px dashed var(--line2);display:flex;align-items:center;gap:6px;font-size:10.5px;color:var(--mute)}
.pendbar{display:flex;align-items:center;gap:8px;margin:0 0 6px;padding:7px 10px;border-radius:9px;background:var(--amber-bg);border:1px solid var(--amber-line);color:var(--amber);font-weight:500;cursor:pointer;transition:filter .15s;animation:rise .45s var(--ease) both}
.pendbar:hover{filter:brightness(.97)}
.pendbar b{font-variant-numeric:tabular-nums}
.grp{margin-top:2px}
.grp-h{display:flex;align-items:center;gap:7px;height:28px;padding:0 8px;border-radius:8px;color:var(--ink2);font-weight:500;cursor:pointer;user-select:none;animation:rise .4s var(--ease) both}
.grp-h:hover{background:var(--hover)}
.grp-h .cv{transition:transform .25s var(--ease);color:var(--faint)}
.grp.closed .cv{transform:rotate(-90deg)}
.grp-b{display:grid;grid-template-rows:1fr;transition:grid-template-rows .28s var(--ease)}
.grp.closed .grp-b{grid-template-rows:0fr}
.grp-b>div{overflow:hidden;position:relative;margin-left:15px;padding-left:6px;border-left:1px solid var(--line2)}
.node{display:flex;align-items:center;gap:8px;height:28px;padding:0 8px;border-radius:8px;color:var(--ink2);cursor:pointer;transition:background .15s,color .15s;animation:rise .4s var(--ease) both;position:relative}
.node:hover{background:var(--hover)}
.node.on{background:var(--active);color:var(--ink);font-weight:500}
.node .t{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.node .nb{min-width:16px;height:16px;padding:0 5px;border-radius:8px;background:var(--amber-bg);color:var(--amber);font-size:10px;font-weight:600;display:grid;place-items:center;transition:all .3s}
.node .nb.zero{background:var(--green-bg);color:var(--green)}
.node.loc::after{content:"";position:absolute;inset:0;border-radius:8px;box-shadow:0 0 0 1.5px var(--accent);animation:ring 1.4s ease-out 3}
.node.newn{animation:rise .5s var(--ease) both,flash 1.8s ease-out .3s}
.top-node{display:flex;align-items:center;gap:8px;height:30px;padding:0 8px;border-radius:8px;color:var(--ink2);font-weight:500;cursor:pointer;animation:rise .4s var(--ease) both;position:relative}
.top-node:hover{background:var(--hover)}
.top-node.on{background:var(--active);color:var(--ink)}
.legend{margin:14px 8px 0;padding-top:10px;border-top:1px dashed var(--line2);display:grid;grid-template-columns:1fr 1fr;gap:5px 6px;font-size:10px;color:var(--mute)}
.legend span{display:flex;align-items:center;gap:6px}

/* ===== home ===== */
.sc-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin-top:14px;text-align:left}
.scard{border:1px solid var(--line2);border-radius:14px;background:#fff;padding:14px;cursor:pointer;transition:border-color .16s,box-shadow .2s,transform .15s;text-align:left;width:100%}
.scard:hover{border-color:var(--accent-line);box-shadow:0 8px 28px rgba(60,80,110,.08);transform:translateY(-1px)}
.scard h4{margin:0 0 6px;font-size:13px;font-weight:600}
.scard p{margin:0;color:var(--mute);font-size:11.5px;line-height:1.5}
.scard .tags{display:flex;flex-wrap:wrap;gap:5px;margin-top:10px}
.gate{margin-top:18px;padding:18px;border-radius:16px;border:1px solid var(--line2);background:#fff;text-align:center;animation:rise .45s var(--ease)}
.gate h3{margin:0 0 4px;font-size:15px}
.gate .gs{color:var(--mute);font-size:12px;margin-bottom:14px}
.gate .modes{display:grid;grid-template-columns:1fr 1fr;gap:10px;max-width:440px;margin:0 auto}
.gmode{padding:14px;border-radius:12px;border:1px solid var(--line2);background:#fafbfc;cursor:pointer;text-align:left;transition:all .16s}
.gmode:hover{border-color:var(--accent-line);background:var(--accent-wash)}
.gmode b{display:block;font-size:13px;margin-bottom:4px}
.gmode span{color:var(--mute);font-size:11.5px;line-height:1.45;display:block}
.scene-bar{display:flex;align-items:center;gap:8px;padding:8px 12px;border-radius:10px;background:var(--accent-wash);border:1px solid var(--accent-line);font-size:11.5px;color:var(--accent-ink)}
.an-steps{display:flex;flex-direction:column;gap:8px;margin:16px auto;max-width:420px;text-align:left}
.an-steps .as{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border-radius:10px;background:#fff;border:1px solid var(--line);opacity:.45}
.an-steps .as.on,.an-steps .as.done{opacity:1}
.an-steps .as.on{border-color:var(--accent-line);background:var(--accent-wash)}
@media(max-width:720px){.sc-grid,.gate .modes{grid-template-columns:1fr}}

#v-home{overflow:auto}
.home{min-height:100%;display:flex;justify-content:center;padding:12vh 24px 80px;background:#fff}
.home-in{width:100%;max-width:560px;text-align:center}
.home-ey{display:inline-flex;gap:6px;align-items:center;height:24px;padding:0 11px;border-radius:999px;border:1px solid var(--accent-line);background:#fff;color:var(--accent-ink);font-size:11px;animation:rise .6s var(--ease) both}
.home h1{margin:14px 0 8px;font-size:22px;font-weight:600;letter-spacing:-.03em;animation:rise .6s var(--ease) .06s both}
.home-sub{margin:0 0 28px;color:var(--mute);font-size:13px;line-height:1.55;animation:rise .6s var(--ease) .12s both}
.seg{position:relative;display:inline-flex;padding:3px;border-radius:999px;background:#f1f1f3;animation:rise .6s var(--ease) .18s both}
.seg button{position:relative;z-index:1;display:inline-flex;align-items:center;gap:5px;height:32px;padding:0 14px;border-radius:999px;color:#85847e;font-weight:500;font-size:12px;transition:color .25s;white-space:nowrap}
.seg button.on{color:#222}
.seg-thumb{position:absolute;z-index:0;top:3px;bottom:3px;left:0;width:0;border-radius:999px;background:#fff;box-shadow:0 1px 4px rgba(0,0,0,.09),0 0 0 1px rgba(0,0,0,.03);transition:transform .42s var(--ease),width .42s var(--ease)}
.home-panels{position:relative;margin-top:22px;text-align:left}
.hp{display:none}
.hp.on{display:block;animation:rise .5s var(--ease)}
.hp-desc{text-align:center;color:var(--mute);margin:0 0 12px;font-size:12px}
.composer{border:1px solid rgba(44,44,40,.1);border-radius:16px;background:#fff;padding:12px 14px 8px;transition:border-color .2s,box-shadow .25s}
.composer:focus-within,.composer.hot{border-color:rgba(44,44,40,.22);box-shadow:0 6px 28px rgba(44,44,40,.06)}
.composer textarea{display:block;width:100%;resize:none;border:0;outline:0;background:none;font-size:12px;line-height:1.65;min-height:22px;max-height:150px;overflow:auto;padding:0}
.composer textarea::placeholder{color:#a9a8a2}
.composer.big{padding:14px 16px 10px;box-shadow:none;border-color:var(--line2)}
.composer.big textarea{min-height:58px;font-size:12.5px}
.comp-bar{display:flex;align-items:center;gap:6px;margin-top:8px}
.chip-btn{display:inline-flex;align-items:center;gap:4px;height:24px;padding:0 8px;border-radius:7px;font-size:11px;color:#777;transition:background .15s}
.chip-btn:hover{background:var(--hover)}
.send{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:#ececec;color:#9a9a9a;transition:background .2s,color .2s,transform .15s}
.send.ok{background:#2f2f2f;color:#fff}
.send.ok:hover{background:#1a1a1a}
.send:active{transform:scale(.92)}
.hint{font-size:10.5px;color:var(--faint)}
.try{display:flex;flex-wrap:wrap;align-items:center;gap:7px;margin:14px 2px 0;justify-content:center;color:var(--mute);font-size:11px}
.sg{height:26px;padding:0 11px;border-radius:999px;border:1px solid var(--line2);background:#fff;font-size:11.5px;color:var(--ink2);display:inline-flex;align-items:center;gap:5px;transition:all .16s;animation:rise .35s var(--ease) both}
.sg:hover{background:#f6f6f7;color:var(--ink)}
.sg.rec{border-color:var(--accent-line);background:var(--accent-wash);color:var(--accent-ink)}
.sg.rec:hover{background:#e6edf3}
.recent{margin-top:26px}
.recent h6,.alist-h{margin:0 4px 8px;font-size:10.5px;font-weight:500;color:var(--faint);letter-spacing:.04em;display:flex;justify-content:space-between}
.rrow{display:flex;align-items:center;gap:10px;padding:9px 12px;border:1px solid var(--line);border-radius:11px;background:#fff;margin-bottom:6px;color:var(--ink2);cursor:pointer;transition:all .16s}
.rrow:hover{background:#fafafa;border-color:var(--line2)}
.rrow .rt{flex:1;min-width:0}
.rrow small{color:var(--mute)}
.alist{border:1px solid var(--line2);border-radius:14px;background:#fff;overflow:hidden;box-shadow:0 10px 40px rgba(60,80,110,.06)}
.arow{display:grid;grid-template-columns:36px 1fr auto auto 14px;gap:14px;align-items:center;padding:13px 16px;border-bottom:1px solid var(--line);cursor:pointer;transition:background .16s,transform .2s;position:relative}
.arow:last-child{border:0}
.arow:hover{background:#fafbfc}
.arow:hover .go{transform:translateX(3px);color:var(--ink)}
.arow .aic{width:36px;height:36px;border-radius:11px;background:var(--accent-wash);color:var(--accent);display:grid;place-items:center}
.arow .an{font-weight:600;font-size:12.5px;display:flex;align-items:center;gap:7px}
.arow .ad{color:var(--mute);font-size:11px;margin-top:1px}
.arow .am{display:flex;gap:14px;font-size:11px;color:var(--ink2)}
.arow .am span{display:flex;flex-direction:column;align-items:flex-start;gap:0}
.arow .am em{font-style:normal;color:var(--faint);font-size:10px}
.arow .go{color:var(--faint);transition:transform .2s var(--ease),color .2s}
.arow.dim{opacity:.55}
.arow.dim:hover{background:#fff}
.home-foot{margin-top:34px;text-align:center;color:var(--faint);font-size:10.5px;display:flex;align-items:center;justify-content:center;gap:8px}
/* ===== chat ===== */
.chatview{display:flex;flex-direction:column}
.chat-scroll{flex:1;min-height:0;overflow-y:auto}
.thread{max-width:780px;margin:0 auto;padding:22px 24px 24px;display:flex;flex-direction:column;gap:18px}
.msg.user{align-self:flex-end;max-width:min(85%,640px);background:#f3f3f3;padding:7px 12px;border-radius:12px 12px 4px 12px;white-space:pre-wrap;word-break:break-word;animation:rise .4s var(--ease);font-size:12px;line-height:1.55;color:#2a2a2a}
.turn{display:flex;flex-direction:column;gap:10px;font-size:12px;line-height:1.68;color:#303030}
.turn>*{animation:rise .45s var(--ease) both}
.turn .p{margin:0}
.turn .p em{font-style:normal;color:var(--accent-ink);font-weight:500}
.turn .sm{font-size:11px;color:var(--mute)}
.think{display:inline-flex;align-items:center;gap:6px;color:#929292;font-size:11px;cursor:pointer;user-select:none;width:fit-content}
.think .sp{width:11px;height:11px;border-radius:50%;border:1.6px solid #dcdcdc;border-top-color:#8a8a8a;animation:spin .8s linear infinite}
.think.done .sp{display:none}
.think .shim{background:linear-gradient(90deg,#8c8c8c 0%,#d4d4d4 50%,#8c8c8c 100%);background-size:200% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:shim 1.6s linear infinite}
.think .cv{transition:transform .22s var(--ease)}
.think.open .cv{transform:rotate(90deg)}
.think-b{display:grid;grid-template-rows:0fr;transition:grid-template-rows .3s var(--ease);margin-top:-4px}
.think-b.open{grid-template-rows:1fr}
.think-b>div{overflow:hidden}
.think-b ul{margin:4px 0 2px 5px;padding:2px 0 2px 12px;border-left:1px solid #e3e3e3;list-style:none;color:#8a8a8a;font-size:11px;line-height:1.7}
.think-b li{animation:rise .35s var(--ease) both}
.card{border:1px solid #ebebef;border-radius:11px;background:#fff;overflow:hidden}
.card-h{display:flex;align-items:center;gap:7px;padding:8px 12px;font-size:11.5px;font-weight:600;color:#303030;border-bottom:1px solid #f1f1f4;background:#fafafb}
.card-h .grow{flex:1}
.card-h .sm{font-weight:400}
.card-b{padding:10px 12px}
.kv{padding:6px 12px}
.kv>div{display:grid;grid-template-columns:48px 1fr;gap:10px;padding:3px 0}
.kv span{color:var(--mute)}
.assume{margin:0 12px 12px;border:1px solid var(--amber-line);background:var(--amber-bg);border-radius:9px;padding:8px 10px}
.assume-h{display:flex;align-items:center;gap:6px;color:var(--amber);font-weight:600;font-size:11.5px}
.assume-h em{font-style:normal;min-width:16px;height:16px;border-radius:8px;background:var(--amber);color:#fff;font-size:10px;display:grid;place-items:center;padding:0 4px}
.assume-h .sm{margin-left:auto;color:#b79a66;font-weight:400}
.ai{display:flex;gap:8px;align-items:flex-start;padding:5px 0 0;color:#5f4a1f;opacity:0;transform:translateY(5px);transition:all .45s var(--ease)}
.ai.in{opacity:1;transform:none}
.ai .n{width:15px;height:15px;border-radius:50%;background:#fff;border:1px solid var(--amber-line);color:var(--amber);font-size:9.5px;display:grid;place-items:center;margin-top:2px;font-weight:600}
.ai .at{flex:1}
.ai.ok{color:var(--green)}
.ai.ok .n{background:var(--green);border-color:var(--green);color:#fff}
.gsteps{padding:4px 0}
.gs{display:grid;grid-template-columns:18px 1fr auto;gap:9px;align-items:center;padding:5px 12px;color:var(--faint);transition:color .3s}
.gs .gi{width:16px;height:16px;border-radius:50%;border:1.5px solid #dcdcdc;display:grid;place-items:center;transition:all .25s}
.gs.run{color:var(--ink)}
.gs.run .gi{border-color:#d6d6d6;border-top-color:var(--accent);animation:spin .8s linear infinite}
.gs.ok{color:var(--ink2)}
.gs.ok .gi{background:var(--green);border-color:var(--green);color:#fff;animation:pop .35s var(--ease)}
.gs .gdt{font-size:10.5px;color:var(--mute);opacity:0;transition:opacity .4s}
.gs.ok .gdt{opacity:1}
.gs .gdt.warn{color:var(--amber)}
.bar{height:3px;border-radius:3px;background:#efeff1;overflow:hidden}
.bar>i{display:block;height:100%;width:0;background:var(--accent);border-radius:3px;transition:width .5s var(--ease)}
.bar.green>i{background:var(--green)}
.arts{display:flex;flex-wrap:wrap;gap:7px}
.art{display:inline-flex;align-items:center;gap:8px;padding:5px 10px 5px 6px;border:1px solid #ebebef;border-radius:9px;background:#fff;font-size:11px;cursor:pointer;transition:all .18s var(--ease);animation:rise .45s var(--ease) both}
.art:hover{border-color:var(--accent-line);background:var(--accent-wash);transform:translateY(-1px)}
.art i{width:22px;height:22px;border-radius:7px;display:grid;place-items:center;background:#f3f3f5;color:#666;font-style:normal}
.art small{color:var(--faint);font-size:10px}
.kpis{display:grid;grid-template-columns:repeat(4,1fr)}
.kpi{padding:10px 12px;border-right:1px solid #f1f1f4}
.kpi:last-child{border:0}
.kpi b{display:block;font-size:19px;font-weight:600;letter-spacing:-.025em;font-variant-numeric:tabular-nums;line-height:1.25}
.kpi b small{font-size:11px;font-weight:500;color:var(--mute);margin-left:2px}
.kpi span{color:var(--mute);font-size:10.5px}
.kpi .dl{display:inline-flex;align-items:center;gap:3px;color:var(--green);font-weight:600;font-size:11px}
.plan{padding:4px 0}
.pl{display:grid;grid-template-columns:18px 1fr auto;gap:9px;align-items:flex-start;padding:5px 12px;transition:all .3s}
.pl .pi{width:16px;height:16px;border-radius:50%;border:1.5px solid #d9d9d9;display:grid;place-items:center;margin-top:2px;color:#fff;transition:all .25s}
.pl.run .pi{border-top-color:var(--accent);animation:spin .8s linear infinite}
.pl.ok .pi{background:var(--green);border-color:var(--green);animation:pop .35s var(--ease)}
.pl .pt{color:var(--ink)}
.pl .pt small{display:block;color:var(--mute);font-size:10.5px}
.pl .pm{font-size:10.5px;color:var(--faint);font-variant-numeric:tabular-nums;padding-top:2px}
.loc-r{display:grid;grid-template-columns:54px 1fr;gap:10px;padding:5px 12px;align-items:flex-start}
.tag{display:inline-flex;align-items:center;justify-content:center;height:18px;border-radius:5px;font-size:10px;font-weight:500;background:#f1f1f3;color:#777}
.tag.blue{background:var(--blue-bg);color:var(--blue)}
.tag.green{background:var(--green-bg);color:var(--green)}
.tag.red{background:var(--red-bg);color:var(--red)}
.lk{color:var(--blue);font-weight:500;cursor:pointer;border-bottom:1px dashed var(--blue-line)}
.lk:hover{background:var(--blue-bg)}
.form{padding:8px 12px 12px;display:flex;flex-direction:column;gap:8px;border-top:1px solid #f1f1f4;background:#fcfcfd}
.form h5{margin:2px 0 0;font-size:11px;color:var(--mute);font-weight:500}
.ck{display:flex;align-items:center;gap:8px;cursor:pointer;user-select:none}
.ck i{width:15px;height:15px;border-radius:4.5px;border:1.5px solid #cfcfd3;display:grid;place-items:center;color:#fff;transition:all .18s var(--ease);background:#fff}
.ck.on i{background:var(--accent);border-color:var(--accent)}
.ck i svg{opacity:0;transform:scale(.5);transition:all .18s}
.ck.on i svg{opacity:1;transform:none}
.sel{display:inline-flex;align-items:center;gap:6px;height:26px;padding:0 9px;border:1px solid var(--line2);border-radius:7px;background:#fff;font-size:11.5px}
.frow{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.inp{height:28px;border:1px solid var(--line2);border-radius:8px;padding:0 10px;outline:0;background:#fff;font-size:12px;transition:border-color .15s}
.inp:focus{border-color:var(--accent)}
textarea.inp{height:auto;padding:6px 10px;resize:none;line-height:1.55}
.cmp{display:grid;grid-template-columns:1fr 1fr}
.cmp>div{padding:10px 12px}
.cmp>div+div{border-left:1px solid #f1f1f4}
.cmp h5{margin:0 0 6px;font-size:10.5px;color:var(--mute);font-weight:500;display:flex;align-items:center;gap:6px}
.stack{display:flex;height:8px;border-radius:5px;overflow:hidden;background:#f1f1f3;margin:6px 0 4px}
.stack i{display:block;height:100%;transition:width .8s var(--ease)}
.stack i.a{background:#5a7390}.stack i.b{background:#d6921f}
.big{font-size:17px;font-weight:600;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.arrow-d{display:inline-flex;align-items:center;gap:6px}
.arrow-d i{font-style:normal;color:var(--faint);text-decoration:line-through}
.note{display:flex;gap:8px;padding:8px 10px;border-radius:9px;background:var(--accent-wash);border:1px solid var(--accent-line);color:var(--accent-ink);font-size:11.5px}
.note.amber{background:var(--amber-bg);border-color:var(--amber-line);color:#7a5513}
.note.green{background:var(--green-bg);border-color:var(--green-line);color:#245f46}
.suggest{display:flex;flex-wrap:wrap;gap:6px;padding-bottom:9px}
.suggest:empty{padding:0}
.comp-wrap{flex:none;padding:0 24px 16px}
.comp-in{max-width:780px;margin:0 auto}
.ok-line{display:flex;align-items:center;gap:8px;color:var(--green);font-weight:500}
.ok-line .ck-c{width:18px;height:18px;border-radius:50%;background:var(--green);display:grid;place-items:center;color:#fff;animation:pop .4s var(--ease)}

/* ===== right panel ===== */
.rp-top{flex:none;display:flex;align-items:center;gap:8px;height:36px;padding:0 8px 0 6px;border-bottom:1px solid #eee;box-shadow:inset 0 1px 0 #d7dce3;background:#fff}
.rp-tabs{display:flex;align-items:center;gap:2px;min-width:0;flex:1;overflow-x:auto;scrollbar-width:none}
.rp-tabs::-webkit-scrollbar{display:none}
.rtab{display:inline-flex;align-items:center;gap:6px;height:27px;padding:0 9px;border-radius:7px;color:var(--mute);font-size:11px;cursor:pointer;white-space:nowrap;transition:background .15s,color .15s;position:relative}
.rtab.new{animation:rise .35s var(--ease) both,flash 1.5s ease-out .2s}
.rtab:hover{background:#f6f6f6}
.rtab.on{background:#f3f3f3;color:var(--ink);font-weight:500}
.rtab .x{opacity:0;width:15px;height:15px;border-radius:4px;display:grid;place-items:center;color:#aaa;margin-right:-3px;transition:all .15s}
.rtab:hover .x,.rtab.on .x{opacity:1}
.rtab .x:hover{background:#e6e6e6;color:#333}
.rtab .bd{min-width:15px;height:15px;border-radius:8px;background:var(--amber-bg);color:var(--amber);font-size:9.5px;font-weight:600;display:grid;place-items:center;padding:0 4px}
.rtab.flash{animation:rise .35s var(--ease) both,flash 1.5s ease-out .2s}
.rp-sub{flex:none;display:flex;align-items:center;gap:8px;min-height:34px;padding:5px 14px;border-bottom:1px solid #f0f0f0;font-size:11px;color:var(--mute);flex-wrap:wrap}
.rp-sub .grow{flex:1}
.rp-body{flex:1;min-height:0;overflow:auto;position:relative;background:#fff}
.rp-in{padding:16px 20px 48px;animation:rise .4s var(--ease)}
.rp-in.still{animation:none}
.rp-empty{height:100%;display:grid;place-items:center;color:var(--faint);text-align:center;padding:30px}
.h2{margin:0 0 10px;font-size:15px;font-weight:600;letter-spacing:-.02em;display:flex;align-items:center;gap:8px}
.h3{margin:20px 0 8px;font-size:12px;font-weight:600;color:#242424;display:flex;align-items:center;gap:7px}
.h3 small{font-weight:400;color:var(--mute)}
.rp-in p{margin:0 0 8px;color:#444}
.crumbs{display:flex;align-items:center;gap:5px;font-size:10.5px;color:var(--mute);margin-bottom:10px}
.crumbs b{color:var(--ink2);font-weight:500}
.stbar{display:flex;gap:3px;margin:2px 0 14px}
.stbar i{flex:1;height:22px;border-radius:6px;background:#f3f3f5;color:#a6a59e;font-style:normal;font-size:10px;display:grid;place-items:center;position:relative;transition:all .4s var(--ease)}
.stbar i.past{background:#eef1f4;color:#7d8794}
.stbar i.cur{color:#fff;font-weight:600;box-shadow:0 2px 8px rgba(0,0,0,.1)}
.stbar i.cur.draft{background:#8d8c86}.stbar i.cur.pending{background:#d6921f}.stbar i.cur.confirmed{background:#3a8f7a}.stbar i.cur.testable{background:#4a78b0}.stbar i.cur.ready{background:#2f7d4f}
.dt{width:100%;border-collapse:separate;border-spacing:0;font-size:11px}
.dt th{text-align:left;font-weight:500;color:var(--mute);font-size:10.5px;padding:6px 8px;border-bottom:1px solid var(--line2);background:#fafafb;position:sticky;top:0}
.dt td{padding:7px 8px;border-bottom:1px solid #f2f2f4;vertical-align:middle}
.dt tr:last-child td{border-bottom:0}
.dt .num{text-align:right;font-variant-numeric:tabular-nums}
.dt tr.dis td{color:var(--faint);background:repeating-linear-gradient(135deg,#fff,#fff 5px,#fafafa 5px,#fafafa 10px)}
.dt .st{display:flex;align-items:center;gap:6px;white-space:nowrap}
.gd{display:inline-grid;place-items:center;width:15px;height:15px;border-radius:4px;font-size:9.5px;font-weight:600;font-style:normal}
.gd.A{background:#e7eef6;color:#3e6a9c}.gd.B{background:#eef3ea;color:#5b7f43}.gd.C{background:#f3efe9;color:#8b7355}
.tbox{border:1px solid var(--line2);border-radius:11px;overflow:hidden;background:#fff}
.dt .tot{font-weight:600}
.dt tfoot td{background:#fafafb;font-weight:500;color:var(--ink2)}
.cell{position:relative;white-space:nowrap}
.cell.chg{background:#fff8e1;animation:flash 2.4s ease-out}
.cell s{color:var(--faint);font-size:10px;margin-right:4px}
.cell b.up{color:var(--green)}
.cell b.dn{color:var(--red)}
.mini-bar{display:flex;align-items:center;gap:6px}
.mini-bar .bar{width:56px}
.skel{border-radius:8px;background:linear-gradient(90deg,#f1f1f3 25%,#e8e8eb 50%,#f1f1f3 75%);background-size:200% 100%;animation:shim 1.4s linear infinite}
.alerts{display:flex;flex-direction:column;gap:6px}
.al{display:flex;gap:8px;padding:7px 10px;border-radius:9px;border:1px solid var(--line);font-size:11px;align-items:flex-start}
.al.w{background:var(--amber-bg);border-color:var(--amber-line);color:#6f5217}
.al.i{background:#fafafb}
.al.r{background:var(--red-bg);border-color:var(--red-line);color:#7b2d27}
.tgl{display:inline-flex;align-items:center;gap:7px;cursor:pointer;user-select:none;font-size:11px;color:var(--ink2)}
.tgl .sw{width:26px;height:15px;border-radius:9px;background:#d9d9dc;position:relative;transition:background .25s}
.tgl .sw::after{content:"";position:absolute;top:2px;left:2px;width:11px;height:11px;border-radius:50%;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.2);transition:transform .25s var(--ease)}
.tgl.on .sw{background:var(--accent)}
.tgl.on .sw::after{transform:translateX(11px)}
.vsw{display:inline-flex;padding:2px;border-radius:8px;background:#f1f1f3}
.vsw button{height:22px;padding:0 10px;border-radius:6px;font-size:11px;color:#85847e;font-weight:500;transition:all .2s}
.vsw button.on{background:#fff;color:#222;box-shadow:0 0 0 1px rgba(0,0,0,.04),0 1px 2px rgba(0,0,0,.05)}
.vsw button[disabled]{opacity:.4;pointer-events:none}

/* flow */
.flow{display:flex;flex-direction:column;align-items:stretch}
.fn{display:grid;grid-template-columns:22px 1fr auto;gap:10px;align-items:center;padding:8px 11px;border:1px solid var(--line2);border-radius:10px;background:#fff;position:relative;transition:all .4s var(--ease)}
.fn .fi{width:20px;height:20px;border-radius:6px;background:#f3f3f5;color:#6e6d68;display:grid;place-items:center;font-size:10.5px;font-weight:600;font-variant-numeric:tabular-nums}
.fn b{display:block;font-size:12px}
.fn em{display:block;font-style:normal;color:var(--mute);font-size:10.5px;line-height:1.4}
.fn.new{border-color:var(--green-line);background:var(--green-bg);animation:rise .6s var(--ease) both,ring2 1.8s ease-out .5s 2}
.fn.new .fi{background:var(--green);color:#fff}
.fn.chg{border-color:var(--amber-line);background:var(--amber-bg)}
.fn.chg .fi{background:var(--amber);color:#fff}
.fn.dec{border-style:dashed}
.fn.ghost{opacity:.75;border-style:dashed}
.fn.sel{box-shadow:0 0 0 1.5px var(--accent)}
.fl{width:1.5px;height:14px;margin:0 auto;background:var(--line2);position:relative}
.fl::after{content:"";position:absolute;bottom:-1px;left:50%;transform:translateX(-50%) rotate(45deg);width:5px;height:5px;border-right:1.5px solid var(--line2);border-bottom:1.5px solid var(--line2)}
.fl.ins{height:30px;background:var(--accent);animation:pulse 1.2s infinite}
.fl.ins::before{content:"+ 在此处插入";position:absolute;left:12px;top:50%;transform:translateY(-50%);font-size:10px;color:var(--accent-ink);background:var(--accent-wash);border:1px solid var(--accent-line);border-radius:5px;padding:0 6px;white-space:nowrap;line-height:16px;animation:none}
.fbr{display:grid;grid-template-columns:1fr 1fr;gap:10px;position:relative;padding-top:2px}
.fbc{display:flex;flex-direction:column;gap:5px}
.fbt{font-size:10px;font-weight:600;padding-left:2px}
.fbt.red{color:var(--red)}.fbt.green{color:var(--green)}
@keyframes ring2{0%{box-shadow:0 0 0 0 rgba(47,125,91,.4)}100%{box-shadow:0 0 0 9px rgba(47,125,91,0)}}
.flow.compact .fn{padding:5px 8px;grid-template-columns:18px 1fr}
.flow.compact .fn b{font-size:11px}
.flow.compact .fn em{display:none}
.flow.compact .fn .fi{width:17px;height:17px;font-size:9.5px}
.flow.compact .fl{height:9px}
.flow.compact .fbr{gap:6px}

/* diff */
.dgrid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.dcol h5{margin:0 0 8px;font-size:11px;display:flex;align-items:center;gap:6px;color:var(--ink2);font-weight:600}
.dcol{padding:12px;border:1px solid var(--line2);border-radius:12px;background:#fff}
.dcol.new{border-color:var(--green-line);background:linear-gradient(#fff,#fbfefc)}
.sum{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:6px}
.sum .chip{height:22px;font-size:11px;padding:0 10px}
.rd{border:1px solid var(--line2);border-radius:10px;overflow:hidden;font-size:11.5px}
.rd div{display:grid;grid-template-columns:18px 1fr auto;gap:8px;padding:6px 10px;border-bottom:1px solid #f3f3f5;align-items:center}
.rd div:last-child{border:0}
.rd .add{background:#f1faf5;color:#245f46}
.rd .del{background:#fdf3f2;color:#8a352f}
.rd .add i,.rd .del i{font-style:normal;font-weight:700;font-family:var(--mono)}
.rd code{font-family:var(--mono);font-size:10.5px}
.impact{display:flex;flex-direction:column;gap:0;border:1px solid var(--line2);border-radius:10px;overflow:hidden}
.im{display:grid;grid-template-columns:20px 1fr auto;gap:9px;padding:8px 11px;border-bottom:1px solid #f3f3f5;align-items:center;opacity:0;transform:translateX(-6px);transition:all .45s var(--ease)}
.im.in{opacity:1;transform:none}
.im:last-child{border:0}
.im .ic{width:18px;height:18px;border-radius:50%;display:grid;place-items:center;color:#fff}
.im .ic.g{background:var(--green)}.im .ic.a{background:var(--amber)}.im .ic.b{background:var(--blue)}
.im small{color:var(--mute);font-size:10.5px}
.sticky-act{position:sticky;bottom:0;margin:18px -20px -48px;padding:12px 20px;background:linear-gradient(rgba(255,255,255,0),#fff 30%);display:flex;gap:8px;align-items:center;justify-content:flex-end;border-top:1px solid var(--line)}

/* eval */
.evh{display:grid;grid-template-columns:auto 1fr;gap:16px;align-items:center;padding:14px;border:1px solid var(--line2);border-radius:12px;margin-bottom:14px;background:linear-gradient(#fff,#fbfbfc)}
.donut{width:62px;height:62px;position:relative}
.donut svg{transform:rotate(-90deg)}
.donut .dn{position:absolute;inset:0;display:grid;place-items:center;font-weight:600;font-size:13px;font-variant-numeric:tabular-nums}
.er{display:grid;grid-template-columns:22px 1fr auto;gap:10px;align-items:center;padding:8px 10px;border-bottom:1px solid #f2f2f4;transition:background .4s}
.er:last-child{border:0}
.er .ei{width:18px;height:18px;border-radius:50%;border:1.5px solid #dcdcdc;display:grid;place-items:center;color:#fff;transition:all .3s}
.er.run .ei{border-top-color:var(--accent);animation:spin .8s linear infinite}
.er.ok .ei{background:var(--green);border-color:var(--green);animation:pop .35s var(--ease)}
.er.chg .ei{background:var(--amber);border-color:var(--amber);animation:pop .35s var(--ease)}
.er.chg{background:#fffbf0}
.er small{display:block;color:var(--mute);font-size:10.5px}
.er .exp{margin-top:5px;padding:6px 9px;border-radius:7px;background:#fff;border:1px dashed var(--amber-line);font-size:10.5px;color:#7a5513;display:grid;grid-template-columns:auto 1fr;gap:3px 8px}
.er .exp em{font-style:normal;color:#b79a66}
.er.q{color:var(--faint)}
.vl{position:relative;padding-left:22px}
.vl::before{content:"";position:absolute;left:7px;top:6px;bottom:6px;width:1.5px;background:var(--line2)}
.vi{position:relative;padding:10px 12px;border:1px solid var(--line2);border-radius:11px;margin-bottom:9px;background:#fff;transition:all .25s var(--ease);animation:rise .45s var(--ease) both}
.vi::before{content:"";position:absolute;left:-19px;top:15px;width:9px;height:9px;border-radius:50%;background:#fff;border:2px solid #b8b7b1}
.vi.cur::before{border-color:var(--green);background:var(--green)}
.vi.draft::before{border-color:var(--amber);background:#fff}
.vi:hover{border-color:#d6d6d9;box-shadow:0 4px 18px rgba(44,44,40,.05)}
.vi.newv{animation:rise .6s var(--ease) both,flash 2s ease-out .4s}
.vh{display:flex;align-items:center;gap:7px;font-weight:600}
.vm{color:var(--mute);font-size:10.5px;margin-top:3px}
.vact{display:flex;gap:6px;margin-top:8px}
.pop{position:absolute;z-index:20;right:10px;top:42px;width:290px;background:#fff;border:1px solid var(--line2);border-radius:12px;box-shadow:0 18px 50px rgba(30,40,60,.18);padding:12px;animation:rise .3s var(--ease)}
.pop h5{margin:0 0 6px;font-size:12px;display:flex;gap:6px;align-items:center}
.pop ul{margin:0 0 10px;padding-left:16px;color:var(--ink2);font-size:11px}
.pop .btnrow{justify-content:flex-end}

/* overview */
.stats{display:grid;grid-template-columns:repeat(4,1fr);border:1px solid var(--line2);border-radius:12px;overflow:hidden;margin-bottom:14px}
.stat{padding:11px 12px;border-right:1px solid var(--line)}
.stat:last-child{border:0}
.stat span{display:block;color:var(--mute);font-size:10.5px}
.stat b{font-size:17px;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.stat small{color:var(--faint);font-size:10px;margin-left:3px}
.box{border:1px solid var(--line2);border-radius:12px;padding:12px;background:#fff}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tl{display:flex;flex-direction:column;gap:0}
.tl>div{display:grid;grid-template-columns:16px 1fr;gap:9px;padding-bottom:12px;position:relative}
.tl>div:last-child{padding-bottom:0}
.tl>div::before{content:"";position:absolute;left:5.5px;top:14px;bottom:-2px;width:1.5px;background:var(--line2)}
.tl>div:last-child::before{display:none}
.tl i{width:12px;height:12px;border-radius:50%;background:#fff;border:2px solid var(--accent);margin-top:3px}
.tl i.g{border-color:var(--green);background:var(--green)}
.tl small{display:block;color:var(--mute);font-size:10.5px}
.dl2{display:grid;grid-template-columns:84px 1fr;gap:7px 12px;font-size:11.5px}
.dl2 dt{color:var(--mute)}
.dl2 dd{margin:0}
.pill-list{display:flex;flex-wrap:wrap;gap:5px}
.fld{font-family:var(--mono);font-size:10.5px;padding:1px 6px;border-radius:5px;background:#f3f3f5;color:#555}
.pr{display:grid;grid-template-columns:20px 1fr auto;gap:10px;padding:10px 12px;border:1px solid var(--line2);border-radius:11px;margin-bottom:8px;background:#fff;align-items:flex-start;transition:all .4s var(--ease)}
.pr .pi{width:18px;height:18px;border-radius:50%;background:var(--amber-bg);color:var(--amber);display:grid;place-items:center;margin-top:1px;transition:all .4s}
.pr.done{background:#f7fcf9;border-color:var(--green-line)}
.pr.done .pi{background:var(--green);color:#fff;animation:pop .4s var(--ease)}
.pr small{display:block;color:var(--mute);font-size:10.5px;margin-top:1px}
.spark{width:100%;height:46px}

/* ===== modal ===== */
#modals{position:fixed;inset:0;z-index:900;pointer-events:none}
.modal-bg{position:absolute;inset:0;background:rgba(32,36,44,.0);backdrop-filter:blur(0);display:grid;place-items:center;pointer-events:auto;transition:background .35s,backdrop-filter .35s}
.modal-bg.in{background:rgba(32,36,44,.32);backdrop-filter:blur(5px)}
.modal-bg.out{background:rgba(32,36,44,0);backdrop-filter:blur(0)}
.modal{background:#fff;border-radius:18px;box-shadow:0 30px 90px rgba(20,30,50,.3);max-height:90vh;display:flex;flex-direction:column;overflow:hidden;opacity:0;transform:translateY(18px) scale(.97);transition:all .42s var(--ease)}
.modal-bg.in .modal{opacity:1;transform:none}
.modal-bg.out .modal{opacity:0;transform:translateY(10px) scale(.985);transition-duration:.25s}
.mh{display:flex;align-items:center;gap:10px;padding:14px 18px;border-bottom:1px solid var(--line)}
.mh h3{margin:0;font-size:15px;letter-spacing:-.02em;display:flex;align-items:center;gap:8px}
.mh small{color:var(--mute);font-size:11px;font-weight:400;letter-spacing:0}
.mb{overflow:auto;flex:1;min-height:0}
.mf{display:flex;align-items:center;gap:12px;padding:12px 18px;border-top:1px solid var(--line);background:#fafafb}
.hf{width:min(1020px,94vw)}
.hf-g{display:grid;grid-template-columns:1.12fr .9fr 1fr;min-height:360px}
.hf-c{padding:14px 16px;border-right:1px solid var(--line);min-width:0}
.hf-c:last-child{border:0;background:#fcfcfd}
.hf-c h4{margin:0 0 10px;font-size:11.5px;display:flex;align-items:center;gap:7px}
.hf-c h4 em{font-style:normal;min-width:18px;height:18px;border-radius:9px;background:#efeff1;color:#666;font-size:10.5px;display:grid;place-items:center;padding:0 5px}
.hf-c h4 em.a{background:var(--amber);color:#fff}
.hf-i{display:grid;grid-template-columns:22px 1fr auto;gap:8px;align-items:center;padding:6px 8px;border-radius:9px;transition:all .22s var(--ease);cursor:default;position:relative}
.hf-i:hover,.hf-i.hl{background:var(--accent-wash)}
.hf-i .ic{width:22px;height:22px;border-radius:7px;background:#f3f3f5;color:#666;display:grid;place-items:center}
.hf-i b{font-weight:500;display:block;font-size:11.5px}
.hf-i small{display:block;color:var(--mute);font-size:10px;line-height:1.35}
.hf-i.packed{opacity:.28;transform:scale(.97)}
.hf-i.fly{visibility:hidden}
.need{display:grid;grid-template-columns:20px 1fr;gap:9px;padding:8px 10px;border-radius:9px;background:var(--amber-bg);border:1px solid var(--amber-line);margin-bottom:7px;color:#6f5217;opacity:0;transform:translateY(6px);transition:all .45s var(--ease)}
.need.in{opacity:1;transform:none}
.need .ni{width:18px;height:18px;border-radius:50%;background:var(--amber);color:#fff;display:grid;place-items:center;font-size:11px;font-weight:700}
.need small{display:block;color:#a98a4c;font-size:10.5px}
.tr{display:flex;align-items:center;gap:7px;padding:4px 7px;border-radius:7px;font-size:11.5px;color:var(--ink2);transition:all .3s var(--ease);position:relative}
.tr.k{font-weight:600;color:var(--ink);margin-top:5px}
.tr.l1{margin-left:16px}
.tr.dim{opacity:.35}
.tr.hl{background:var(--accent-wash);color:var(--accent-ink)}
.tr.made{background:var(--green-bg);color:var(--green)}
.tr.made::after{content:"✓";margin-left:auto;font-weight:700;animation:pop .4s var(--ease)}
.opts{display:flex;gap:16px;flex-wrap:wrap}
.pk{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:34px;min-height:440px;text-align:center}
.pkring{width:92px;height:92px;position:relative}
.pkring svg{transform:rotate(-90deg)}
.pkring .pc{position:absolute;inset:0;display:grid;place-items:center;font-size:19px;font-weight:600;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.fly-chip{position:fixed;z-index:1000;display:flex;align-items:center;gap:6px;height:24px;padding:0 10px;border-radius:7px;background:#fff;border:1px solid var(--accent-line);box-shadow:0 8px 24px rgba(60,80,110,.2);font-size:11px;color:var(--accent-ink);pointer-events:none;white-space:nowrap}
.rv{width:min(560px,92vw)}
.rv-b{padding:16px 18px;display:flex;flex-direction:column;gap:12px}
.rvr{display:grid;grid-template-columns:30px 1fr auto;gap:11px;align-items:center;padding:9px 11px;border:1px solid var(--line2);border-radius:11px}
.rvr .av{width:30px;height:30px;border-radius:50%;background:#e8eef4;color:var(--accent-ink);display:grid;place-items:center;font-weight:600;font-size:11px}
.rvr.ok{border-color:var(--green-line);background:#f7fcf9}
.rvr.ok .av{background:var(--green);color:#fff}
.ckl{display:flex;flex-direction:column;gap:6px}
.ckl div{display:flex;align-items:center;gap:8px}
.ckl .c{width:16px;height:16px;border-radius:50%;background:var(--green);color:#fff;display:grid;place-items:center}
.onto{display:flex;flex-direction:column;gap:7px}
.onr{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.onr .ob{padding:3px 10px;border-radius:7px;border:1px solid var(--accent-line);background:var(--accent-wash);color:var(--accent-ink);font-weight:500}
.onr .rel{color:var(--mute);font-size:10.5px;display:flex;align-items:center;gap:4px}
.tool{display:grid;grid-template-columns:30px 1fr auto;gap:10px;padding:9px 11px;border:1px solid var(--line2);border-radius:11px;margin-bottom:7px;align-items:center}
.tool .ti{width:30px;height:30px;border-radius:9px;background:#f3f3f5;color:#666;display:grid;place-items:center}
.tool small{display:block;color:var(--mute);font-size:10.5px}
.cd{border:1px solid var(--line2);border-radius:11px;padding:10px 12px;margin-bottom:8px}
.cd h6{margin:0 0 6px;font-size:11.5px;display:flex;align-items:center;gap:7px}
.mr{display:grid;grid-template-columns:1fr 18px 1fr auto;gap:8px;align-items:center;padding:6px 10px;border-bottom:1px solid #f3f3f5;font-size:11px}
.mr:last-child{border:0}
.mr .ar{color:var(--faint)}
.mr.w{background:var(--amber-bg)}
.mapbox{border:1px solid var(--line2);border-radius:11px;overflow:hidden}

/* ===== director layer ===== */
#cursor{position:fixed;left:0;top:0;z-index:2000;pointer-events:none;width:24px;height:24px;opacity:0;transition:opacity .35s;filter:drop-shadow(0 2px 5px rgba(0,0,0,.28));will-change:transform}
#cursor.on{opacity:1}
#cursor svg{transition:transform .12s}
#cursor.press svg{transform:scale(.82)}
.ripple{position:fixed;z-index:1999;width:34px;height:34px;margin:-17px 0 0 -17px;border-radius:50%;border:2px solid var(--accent);background:rgba(90,115,144,.12);pointer-events:none;animation:rip .65s ease-out forwards}
@keyframes rip{from{transform:scale(.25);opacity:1}to{transform:scale(1.5);opacity:0}}
#left-in.still .sb-item,#left-in.still .node,#left-in.still .grp-h,#left-in.still .top-node,#left-in.still .proj,#left-in.still .pendbar{animation:none!important}
.hf-i.pre{opacity:0;transform:translateX(-8px)}
.tr.pre{opacity:0;transform:translateX(-6px)}
#callouts{position:fixed;inset:0;z-index:1500;pointer-events:none}
.co-ring{position:fixed;border-radius:10px;border:2px solid var(--accent);box-shadow:0 0 0 4px rgba(90,115,144,.15),0 0 24px rgba(90,115,144,.25);animation:corise .45s var(--ease) both,copulse 2.2s ease-in-out .5s infinite;transition:left .25s,top .25s,width .25s,height .25s}
@keyframes corise{from{opacity:0;transform:scale(1.06)}to{opacity:1;transform:none}}
@keyframes copulse{0%,100%{box-shadow:0 0 0 4px rgba(90,115,144,.15),0 0 24px rgba(90,115,144,.22)}50%{box-shadow:0 0 0 8px rgba(90,115,144,.08),0 0 30px rgba(90,115,144,.3)}}
.co-tip{position:fixed;width:max-content;max-width:268px;background:#1f2430;color:#f4f6fa;font-size:11.5px;line-height:1.6;padding:8px 12px 9px 10px;border-radius:11px;box-shadow:0 14px 40px rgba(15,20,35,.38);display:flex;gap:8px;align-items:flex-start;animation:rise .5s var(--ease) .12s both;transition:left .25s,top .25s}
.co-tip .cn{flex:none;min-width:17px;height:17px;border-radius:9px;background:#fff;color:#1f2430;font-size:10px;font-weight:700;display:grid;place-items:center;margin-top:1px;padding:0 4px}
.co-tip b{color:#fff}
.co-tip em{font-style:normal;color:#9fb6cf}
#toasts{position:fixed;top:60px;left:50%;transform:translateX(-50%);z-index:1700;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none}
.toast{display:flex;align-items:center;gap:8px;padding:8px 14px;border-radius:11px;background:#fff;border:1px solid var(--line2);box-shadow:0 12px 36px rgba(30,40,60,.16);font-size:12px;opacity:0;transform:translateY(-10px) scale(.97);transition:all .4s var(--ease);color:var(--ink)}
.toast.in{opacity:1;transform:none}
.toast svg{color:var(--accent)}
.toast.good svg{color:var(--green)}
#dock{position:fixed;left:14px;bottom:14px;z-index:1600;width:344px;font-size:12px;transition:opacity .3s,transform .35s var(--ease)}
#dock.hid{opacity:.0;pointer-events:none;transform:translateY(10px)}
#dock-fab{position:fixed;left:14px;bottom:14px;z-index:1599;width:34px;height:34px;border-radius:50%;background:rgba(28,32,40,.9);color:#fff;display:grid;place-items:center;opacity:0;pointer-events:none;transition:opacity .3s;box-shadow:0 8px 24px rgba(15,20,35,.3)}
#dock-fab.on{opacity:.45;pointer-events:auto}
#dock-fab:hover{opacity:1}
.dock-bar{display:flex;align-items:center;gap:9px;height:46px;padding:0 6px 0 8px;border-radius:15px;background:rgba(28,32,40,.94);backdrop-filter:blur(16px);color:#fff;box-shadow:0 14px 44px rgba(15,20,35,.4)}
.dock-bar .dp{width:30px;height:30px;border-radius:10px;background:rgba(255,255,255,.1);display:grid;place-items:center;flex:none;cursor:pointer;transition:background .15s}
.dock-bar .dp:hover{background:rgba(255,255,255,.18)}
.dock-info{flex:1;min-width:0;cursor:pointer;line-height:1.3}
.dock-info small{display:block;color:#93a1b5;font-size:10px;letter-spacing:.02em}
.dock-info b{display:block;font-size:11.5px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dock-next{height:32px;padding:0 12px;border-radius:10px;background:#fff;color:#1f2430;font-weight:600;font-size:11.5px;display:inline-flex;align-items:center;gap:5px;transition:transform .12s,opacity .2s}
.dock-next:active{transform:scale(.95)}
.dock-next[disabled]{opacity:.5;pointer-events:none}
.dock-panel{position:absolute;left:0;right:0;bottom:54px;background:#fff;border-radius:16px;box-shadow:0 24px 70px rgba(15,20,35,.3);border:1px solid var(--line2);max-height:min(72vh,640px);display:flex;flex-direction:column;overflow:hidden;opacity:0;transform:translateY(12px) scale(.97);transform-origin:bottom left;pointer-events:none;transition:all .35s var(--ease)}
#dock.open .dock-panel{opacity:1;transform:none;pointer-events:auto}
.dp-h{padding:12px 12px 10px;border-bottom:1px solid var(--line)}
.dp-note{margin-top:10px;padding:9px 11px;border-radius:10px;background:#f6f8fa;border:1px solid #e6ebf0;font-size:11.5px;line-height:1.65;color:#3a4350}
.dp-note small{display:block;color:var(--mute);font-size:10px;margin-bottom:2px;letter-spacing:.04em}
.dp-list{overflow:auto;padding:6px;flex:1;min-height:0}
.dp-s{display:grid;grid-template-columns:20px 1fr;gap:8px;align-items:center;padding:6px 8px;border-radius:9px;cursor:pointer;color:var(--ink2);font-size:11.5px;transition:background .15s}
.dp-s:hover{background:var(--hover)}
.dp-s .n{width:18px;height:18px;border-radius:50%;border:1.5px solid #d4d4d8;display:grid;place-items:center;font-size:9.5px;font-weight:600;color:#a0a0a8;transition:all .25s}
.dp-s.done .n{background:var(--green);border-color:var(--green);color:#fff}
.dp-s.cur{background:var(--accent-wash);color:var(--ink);font-weight:500}
.dp-s.cur .n{border-color:var(--accent);color:var(--accent)}
.dp-f{display:flex;align-items:center;gap:10px;padding:9px 12px;border-top:1px solid var(--line);background:#fafafb;flex-wrap:wrap}
.dp-f .tgl{font-size:10.5px}
.dp-btns{display:flex;gap:6px;margin-left:auto}
.pseg{display:flex;padding:2px;border-radius:9px;background:#f1f1f3;gap:2px;flex-wrap:wrap}
.pseg button{flex:1;min-width:0;height:28px;padding:0 6px;border-radius:7px;font-size:10.5px;color:#85847e;font-weight:500;transition:all .2s;line-height:1.15}
.pseg button.on{background:#fff;color:#222;box-shadow:0 1px 3px rgba(0,0,0,.08)}
.prog{height:2px;background:rgba(255,255,255,.14);border-radius:2px;position:absolute;left:14px;right:14px;bottom:0;overflow:hidden}
.prog i{display:block;height:100%;width:0;background:#fff;transition:width .5s var(--ease)}
.dock-wrap{position:relative}
@media (max-width:900px){#dock{width:300px}}
/* end-card */
.finale{display:grid;place-items:center;text-align:center;gap:6px;padding:20px;border-radius:14px;background:linear-gradient(135deg,#f2f6fa,#fbfcfd);border:1px solid var(--accent-line)}
.finale h4{margin:0;font-size:14px;letter-spacing:-.02em}
.lifeline{display:flex;align-items:center;gap:6px;flex-wrap:wrap;justify-content:center;margin:8px 0 4px}
.lifeline span{height:22px;padding:0 10px;border-radius:11px;background:#fff;border:1px solid var(--accent-line);font-size:10.5px;display:inline-flex;align-items:center;color:var(--accent-ink)}
.lifeline i{color:var(--faint);font-style:normal}
</style>
</head>
<body>
<div id="app">
  <aside id="left" class="side"><div class="side-in" id="left-in"></div></aside>
  <div class="rz" id="rz-left"></div>
  <main id="main">
    <header id="top">
      <div class="top-l"><button class="ibtn" id="btn-left" aria-label="切换侧边栏"></button><div class="crumb" id="crumb"></div></div>
      <div class="top-c"><div id="life" class="idle"></div></div>
      <div class="top-r" id="top-r"></div>
    </header>
    <div id="views">
      <section class="view on" id="v-home"></section>
      <section class="view chatview" id="v-proto"></section>
      <section class="view chatview" id="v-build"></section>
    </div>
  </main>
  <div class="rz off" id="rz-right"></div>
  <aside id="right" class="side collapsed"><div class="side-in" id="right-in"></div></aside>
</div>
<div id="callouts"></div>
<div id="cursor"><svg width="22" height="22" viewBox="0 0 24 24"><path d="M5 3l14 8-6.2 1.6L9.6 19z" fill="#1f2430" stroke="#fff" stroke-width="1.5" stroke-linejoin="round"/></svg></div>
<div id="toasts"></div>
<div id="modals"></div>
<div id="dock"></div>

<script>
'use strict';

/* ---------- streaming helpers ---------- */
async function stream(el,h,cps=78){
 if(FAST){el.innerHTML=h;return}
 const toks=h.match(/<[^>]+>|[^<]/g)||[];let out='',i=0;const per=Math.max(1,Math.round(cps/60*SPEED));
 return new Promise((res,rej)=>{const id=RUN;(function tick(){if(RUN!==id)return rej(CANCEL);let n=0;while(i<toks.length&&n<per){out+=toks[i];if(toks[i][0]!=='<')n++;i++}el.innerHTML=out;if(i<toks.length)requestAnimationFrame(tick);else res()})()})
}
function countUp(el,to,{from=0,dec=0,suf='',ms=900}={}){if(!el)return;if(FAST){el.textContent=fmt(to,dec)+suf;return}const t0=performance.now();(function f(t){const k=Math.min(1,(t-t0)/(ms/SPEED)),e=1-Math.pow(1-k,3);el.textContent=fmt(from+(to-from)*e,dec)+suf;if(k<1)requestAnimationFrame(f)})(t0)}

function initResizers(){
 [['rz-left','left'],['rz-right','right']].forEach(([id,side])=>{const h=$('#'+id);
  h.addEventListener('pointerdown',e=>{e.preventDefault();document.body.classList.add('resizing');h.classList.add('act');h.setPointerCapture(e.pointerId);
   const mv=ev=>{if(side==='left')document.documentElement.style.setProperty('--lw',Math.max(0,ev.clientX)+'px');else document.documentElement.style.setProperty('--rw',Math.max(0,innerWidth-ev.clientX)+'px')};
   const up=()=>{h.removeEventListener('pointermove',mv);h.removeEventListener('pointerup',up);document.body.classList.remove('resizing');h.classList.remove('act')};
   h.addEventListener('pointermove',mv);h.addEventListener('pointerup',up)});
  h.addEventListener('dblclick',()=>document.documentElement.style.setProperty(side==='left'?'--lw':'--rw',side==='left'?'260px':'560px'))})
}

const D={open:false,hidden:false,cursor:true,callouts:true,speedI:0,running:false,idx:-1,last:-1,auto:false};
let CX=innerWidth*.62,CY=innerHeight*.72;
async function waitFor(sel,ms=5000){const t0=Date.now();for(;;){const el=typeof sel==='function'?sel():(typeof sel==='string'?$(sel):sel);if(el&&el.isConnected)return el;if(Date.now()-t0>ms)return null;await sleep(60)}}
async function moveTo(el,{dx=.5,dy=.5}={}){
 if(!D.cursor||FAST||!el)return;const c=$('#cursor');const r=el.getBoundingClientRect();
 const x=r.left+Math.min(r.width*dx,Math.max(6,r.width-6)),y=r.top+r.height*dy;const dist=Math.hypot(x-CX,y-CY);const t=Math.min(1100,Math.max(420,dist*1.15))/SPEED;
 c.classList.add('on');c.style.transition=`opacity .35s,transform ${t}ms cubic-bezier(.5,.05,.2,1)`;c.style.transform=`translate(${x-4}px,${y-3}px)`;CX=x;CY=y;await sleep(t+70)}
async function ghost(sel,o={}){
 const el=await waitFor(sel);if(!el)return null;
 if(!FAST&&D.cursor){softScroll(el);await moveTo(el,o)}
 if(o.click!==false){
  if(!FAST&&D.cursor){const c=$('#cursor');c.classList.add('press');const rp=H(`<div class="ripple" style="left:${CX}px;top:${CY}px"></div>`);document.body.appendChild(rp);setTimeout(()=>rp.remove(),700);await sleep(130);c.classList.remove('press')}
  el.click()}
 return el}
async function ghostType(sel,text){const ta=await waitFor(sel);if(!ta)return;if(!FAST&&D.cursor)await moveTo(ta,{dx:.4,dy:.5});await typeFill(ta,text,FAST)}
async function ghostHover(sel){const el=await waitFor(sel);if(!el)return;if(!FAST&&D.cursor)await moveTo(el);el.dispatchEvent(new MouseEvent('mouseover',{bubbles:true}));return el}
function hideCursor(){$('#cursor').classList.remove('on')}
function softScroll(el,center=false){let a=el.parentElement;while(a&&a!==document.body){const o=getComputedStyle(a).overflowY;if((o==='auto'||o==='scroll')&&a.scrollHeight>a.clientHeight+2)break;a=a.parentElement}
 if(!a||a===document.body)return;const ar=a.getBoundingClientRect(),r=el.getBoundingClientRect();const pad=70;let d=0;
 if(center){if(r.bottom>ar.bottom-pad||r.top<ar.top+pad)d=(r.top+r.height/2)-(ar.top+ar.height/2)}else{if(r.bottom>ar.bottom-pad)d=r.bottom-ar.bottom+pad;else if(r.top<ar.top+pad)d=r.top-ar.top-pad}
 if(d)a.scrollTo({top:a.scrollTop+d,behavior:FAST?'auto':'smooth'})}
/* ---- callouts ---- */
let COs=[],coRAF=0;
function clearCallouts(){COs.forEach(c=>{c.ring.remove();c.tip.remove()});COs=[];cancelAnimationFrame(coRAF);coRAF=0}
function callout(sel,html,{n=null,side='b',pad=4}={}){
 if(!D.callouts||FAST)return;const el=typeof sel==='function'?sel():(typeof sel==='string'?$(sel):sel);if(!el)return;
 const ring=H('<div class="co-ring"></div>'),tip=H(`<div class="co-tip">${n!=null?`<span class="cn">${n}</span>`:''}<span>${html}</span></div>`);
 softScroll(el,true)
 $('#callouts').append(ring,tip);COs.push({el,ring,tip,side,pad});if(!coRAF)coLoop()}
function coLoop(){
 const placed=[];
 COs.forEach(c=>{if(!c.el.isConnected){c.ring.style.display='none';c.tip.style.display='none';return}const r=c.el.getBoundingClientRect();
  if(r.width<2||r.height<2){c.ring.style.display='none';c.tip.style.display='none';return}c.ring.style.display='';c.tip.style.display='';
  const p=c.pad;c.ring.style.left=r.left-p+'px';c.ring.style.top=r.top-p+'px';c.ring.style.width=r.width+2*p+'px';c.ring.style.height=r.height+2*p+'px';
  const tw=c.tip.offsetWidth,th=c.tip.offsetHeight,gap=12,W=innerWidth,Hh=innerHeight;
  const cand={b:[r.left,r.bottom+gap],t:[r.left,r.top-th-gap],r:[r.right+gap,r.top],l:[r.left-tw-gap,r.top],bi:[r.left+12,r.bottom-th-10],ti:[r.left+12,r.top+10]};
  const fits=([x,y])=>x>=8&&y>=8&&x+tw<=W-8&&y+th<=Hh-8;
  const hit=([x,y])=>placed.some(q=>x<q[0]+q[2]+6&&x+tw+6>q[0]&&y<q[1]+q[3]+6&&y+th+6>q[1]);
  const order=[c.side,'b','t','r','l','ti','bi'];let pos=null;
  for(const k of order){if(cand[k]&&fits(cand[k])&&!hit(cand[k])){pos=cand[k];break}}
  if(!pos)for(const k of order){if(cand[k]&&fits(cand[k])){pos=cand[k];break}}
  if(!pos)pos=[Math.min(Math.max(8,r.left),W-tw-8),Math.min(Math.max(8,r.bottom+gap),Hh-th-8)];
  pos=[Math.min(Math.max(8,pos[0]),W-tw-8),Math.min(Math.max(8,pos[1]),Hh-th-8)];placed.push([pos[0],pos[1],tw,th]);
  c.tip.style.left=pos[0]+'px';c.tip.style.top=pos[1]+'px'});
 coRAF=COs.length?requestAnimationFrame(coLoop):0}

/* ---- 导演控制 ---- */
async function runStep(i,{quiet=false}={}){
 const path=['B','C','D'].includes(S.path)?S.path:'A';const st=STEPS[path][i];if(!st)return;D.running=true;D.idx=i;D.last=i;clearCallouts();renderDock();const id=RUN;
 try{await st.run();S.phase=Math.max(S.phase,st.to)}catch(e){if(e!==CANCEL)console.error(e)}finally{if(RUN===id){D.running=false;if(!quiet)hideCursor()}renderDock()}}
async function dNext(){
 if(D.running)return;await untilIdle();const path=['B','C','D'].includes(S.path)?S.path:'A';const steps=STEPS[path];const i=steps.findIndex(s=>s.to>S.phase);
 if(i<0){toast('演示已完成 · 点「重置」或切换路径可重新开始',{icon:'check',good:true});return}
 await runStep(i)}
async function dPrev(){if(D.running)return;const path=['B','C','D'].includes(S.path)?S.path:'A';const steps=STEPS[path];const i=steps.findIndex(s=>s.to>S.phase);const cur=i<0?steps.length:i;if(cur<=1){toast('已经是第一步',{icon:'info'});return}await jumpTo(cur-2)}
async function jumpTo(n){
 D.auto=false;const path=S.path;resetApp(path,{keepDock:true});setHomeTab(tabOfPath(path));
 D.running=true;renderDock();const id=RUN;FAST=true;document.body.classList.add('fast');
 try{for(let k=0;k<n;k++){await untilIdle();await STEPS[path][k].run();S.phase=Math.max(S.phase,STEPS[path][k].to)}await untilIdle()}catch(e){if(e!==CANCEL)console.error(e)}
 FAST=false;document.body.classList.remove('fast');clearCallouts();if(RUN===id){D.running=false;D.last=n-1;await sleep(250);await runStep(n)}else{renderDock()}}
async function dAuto(){
 if(D.auto){D.auto=false;renderDock();return}D.auto=true;renderDock();
 const id=RUN;while(D.auto&&RUN===id){await dNext();if(!D.auto||RUN!==id)break;const path=['B','C','D'].includes(S.path)?S.path:'A';const i=STEPS[path].findIndex(s=>s.to>S.phase);if(i<0)break;await sleep(1500)}
 D.auto=false;renderDock()}
function resetApp(path='A',{keepDock=false}={}){
 RUN++;FAST=false;document.body.classList.remove('fast');D.auto=false;D.running=false;D.idx=-1;D.last=-1;clearCallouts();hideCursor();closeModals();$('#toasts').innerHTML='';
 S=initState();S.path=path;PC.reset();BC.reset();showView('home');S.homeStage='landing';S.scene=null;S.libActive=null;S.homeTab=tabOfPath(path);renderHome();setHomeTab(tabOfPath(path));S.path=path;S.phase=0;
 setLife(-1);renderLeft({enter:true});setRight(false);RP.set([],null);renderTop();renderDock()}
/* ---- dock UI ---- */
function dockHide(h){D.hidden=h;$('#dock').classList.toggle('hid',h);$('#dock-fab').classList.toggle('on',h)}
let DOCKSIG='';
function renderDock(){
 const dk=$('#dock');const path=['B','C','D'].includes(S.path)?S.path:'A';const steps=STEPS[path];const n=steps.length;
 const ni=steps.findIndex(s=>s.to>S.phase);const done=ni<0?n:ni;
 const run=D.running?steps[D.idx]:null;
 const info=run?{k:`进行中 · ${D.idx+1} / ${n}`,t:run.title}:ni<0?{k:`路径 ${path} · 全部完成`,t:'演示完成'}:{k:`下一步 · ${ni+1} / ${n}`,t:steps[ni].title};
 const fresh=!dk.querySelector('.dock-wrap');
 const plabel={D:'从企业引导',A:'快速模式',C:'逐步模式',B:'项目库'};
 const html=`<div class="dock-wrap"><div class="dock-panel"><div class="dp-h"><div class="pseg"><button data-act="d-path" data-p="D" class="${path==='D'?'on':''}">引导</button><button data-act="d-path" data-p="A" class="${path==='A'?'on':''}">快速</button><button data-act="d-path" data-p="C" class="${path==='C'?'on':''}">逐步</button><button data-act="d-path" data-p="B" class="${path==='B'?'on':''}">项目</button></div><div class="dp-note"><small>${plabel[path]||''}</small>同一入口 · 快速 / 逐步</div></div>
  <div class="dp-list">${steps.map((s,i)=>`<div class="dp-s ${i<done?'done':''} ${i===ni&&!D.running?'cur':''} ${run&&i===D.idx?'cur':''}" data-act="d-step" data-i="${i}"><span class="n">${i<done?ic('check',9,3.4):i+1}</span><span>${s.title}</span></div>`).join('')}</div>
  <div class="dp-f"><label class="tgl ${D.cursor?'on':''}" data-act="d-cursor"><i class="sw"></i>光标</label><label class="tgl ${D.callouts?'on':''}" data-act="d-callouts"><i class="sw"></i>标注</label><button class="btn sm" data-act="d-speed">速度 ${[1,1.6,2.4][D.speedI]}×</button>
   <div class="dp-btns"><button class="btn sm" data-act="d-reset">${ic('refresh',12)}重置</button><button class="btn sm ${D.auto?'primary':''}" data-act="d-auto">${ic(D.auto?'pause':'play',12)}${D.auto?'暂停':'自动播放'}</button></div></div></div>
  <div class="dock-bar"><button class="dp" data-act="d-toggle" title="演示导航 (D)">${ic('list',15)}</button><div class="dock-info" data-act="d-toggle"><small>${info.k}</small><b>${info.t}</b></div><button class="dp" data-act="d-prev" title="上一步 (←)"><span style="display:inline-flex;transform:scaleX(-1)">${ic('arrR',15)}</span></button><button class="dock-next" data-act="d-next" ${D.running?'disabled':''}>${D.running?'演示中…':ni<0?'已完成':'下一步'} ${D.running||ni<0?'':ic('arrR',13)}</button><button class="dp" data-act="d-hide" title="隐藏 (H)">${ic('x',13)}</button><div class="prog"><i style="width:${done/n*100}%"></i></div></div></div>`;
 const sc=$('.dp-list',dk)?.scrollTop||0;dk.innerHTML=html;const l=$('.dp-list',dk);if(l){l.scrollTop=sc;const c=$('.dp-s.cur',l);if(c&&(!sc||D.running)){const top=c.offsetTop-l.clientHeight/2+c.offsetHeight/2;l.scrollTop=Math.max(0,top)}}
 $('#dock').classList.toggle('open',D.open)}
setInterval(()=>{const path=['B','C','D'].includes(S.path)?S.path:'A';const steps=STEPS[path];const sig=[path,S.phase,D.running,D.idx,D.last,D.auto,steps.findIndex(s=>s.to>S.phase)].join('|');if(sig!==DOCKSIG){DOCKSIG=sig;renderDock()}},250);

PC=Chat($('#v-proto'),'继续描述想调整的地方…');
BC=Chat($('#v-build'),'描述要修改的内容…');

setLife(-1);renderLeft({enter:true});setRight(false);RP.set([],null);renderTop();initResizers();renderDock();
$('#dock-fab').innerHTML=ic('list',15);$('#dock-fab').dataset.act='d-fab';
$('#cursor').style.transform=`translate(${CX}px,${CY}px)`;
addEventListener('resize',()=>placeSeg(false));

</script>
